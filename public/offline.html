<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kochat Offline</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #f8fbff 0%, #eef4ff 100%);
        color: #0f172a;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: linear-gradient(180deg, #09111d 0%, #0f1728 100%);
          color: #f8fafc;
        }
      }

      main {
        width: min(100% - 32px, 28rem);
        border-radius: 28px;
        border: 1px solid rgba(148, 163, 184, 0.25);
        background: rgba(255, 255, 255, 0.86);
        padding: 32px 28px;
        text-align: center;
        box-shadow: 0 20px 60px rgba(15, 23, 42, 0.12);
        backdrop-filter: blur(14px);
      }

      @media (prefers-color-scheme: dark) {
        main {
          background: rgba(10, 16, 28, 0.84);
          box-shadow: 0 24px 70px rgba(0, 0, 0, 0.3);
        }
      }

      h1 {
        margin: 0 0 12px;
        font-size: 2rem;
      }

      p {
        margin: 0;
        line-height: 1.7;
        color: inherit;
        opacity: 0.78;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Kochat</h1>
      <p>You are offline right now. Reconnect to load conversations, messages, and live updates again.</p>
    </main>
  </body>
</html>
